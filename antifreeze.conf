# antifreeze.conf — настройки демона (правь и перезапусти: antifreeze-install.sh --restart)
AF_LOOP_SEC=60        # цикл демона, сек
AF_CPU_MB=150         # сколько MiB хэшировать за цикл (CPU-burst, держит ядро активным)
AF_USE_MPV=1          # 1 = аудио-щит через mpv В ПРОЦЕССЕ Termux (perceptible => НЕ кэшируется => НЕ морозится)
AF_USE_API_AUDIO=1    # 1 = дублирующий щит через Termux:API MediaPlayer (держит CPU от deep-suspend)
AF_WAKELOCK=1         # 1 = переустанавливать termux-wake-lock каждый цикл
AF_GUARD_SERVICES="sshd tor tx11 tx11-xfce4"   # runit-сервисы под охраной демона (guard: sv up + снятие down-маркеров)
AF_MPV_AO=opensles    # аудиовыход mpv
AF_AUDIO_FILE="/data/data/com.termux/files/home/antifreeze/audio/silence.flac"
